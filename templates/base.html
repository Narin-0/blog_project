<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Django Blog</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
        nav { background: #f4f4f4; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        .btn { padding: 5px 10px; text-decoration: none; border-radius: 3px; background: #eee; color: #333; }
        .btn-danger { color: red; }
        .post-item { border-bottom: 1px solid #ccc; padding: 10px 0; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'post_list' %}">🏠 Главная</a> | 
        {% if user.is_authenticated %}
            <strong>{{ user.username }}</strong>
            <a href="{% url 'post_create' %}" class="btn">➕ Создать пост</a>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Войти</a> | 
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>

    {% block content %}
    {% endblock %}
</body>
</html>
